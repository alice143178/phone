<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0b12">
<title>AI Phone</title>
<style>
:root{
  --bg:#0a0b12;
  --surface:#131520;
  --surface2:#1c1f30;
  --border:rgba(255,255,255,0.08);
  --text:#e8ecf4;
  --text2:#8b92a8;
  --accent:#5de8c1;
  --header-h:52px;
  --statusbar-h:28px;
  --navbar-h:52px;
  --radius:18px;
  --font:'PingFang SC','Noto Sans SC',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100dvh;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;}
#phone{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
#statusBar{height:var(--statusbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;flex-shrink:0;}
#statusIcons{display:flex;align-items:center;gap:5px;}
#mainArea{flex:1;position:relative;overflow:hidden;}
#homeScreen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 20% 10%,rgba(93,232,193,0.07) 0%,transparent 60%),
    radial-gradient(ellipse 60% 60% at 80% 80%,rgba(58,184,245,0.06) 0%,transparent 60%);
  overflow:hidden;
}
#clockWidget{padding:28px 0 24px;text-align:center;flex-shrink:0;}
#clockTime{font-size:64px;font-weight:200;letter-spacing:-2px;color:rgba(255,255,255,0.92);line-height:1;}
#clockDate{margin-top:6px;font-size:14px;color:rgba(255,255,255,0.55);}
#appGrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;padding:8px 16px 16px;align-content:start;overflow-y:auto;}
.app-icon-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;}
.app-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;transition:transform 0.12s,opacity 0.12s;overflow:hidden;}
.app-icon img{width:100%;height:100%;object-fit:cover;border-radius:16px;}
.app-icon-wrap:active .app-icon{transform:scale(0.88);opacity:0.8;}
.app-icon-label{font-size:11.5px;color:rgba(255,255,255,0.75);text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app-icon.placeholder{opacity:0.4;}
#dock{
  flex-shrink:0;
  padding:10px 24px 14px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(255,255,255,0.05);
  border-top:1px solid rgba(255,255,255,0.08);
}
#dock .app-icon-wrap{position:relative;z-index:1;}
#appLayer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);z-index:10;}
#appLayer.visible{transform:translateX(0);}
#appLayer.closing{transform:translateX(100%);}
#appHeader{height:var(--header-h);display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
#appHeaderBack{width:40px;height:40px;border-radius:12px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
#appHeaderBack:active{background:var(--surface2);}
#appHeaderTitle{flex:1;text-align:center;font-size:16px;font-weight:600;}
#appHeaderRight{width:40px;display:flex;justify-content:flex-end;align-items:center;flex-shrink:0;}
#appContent{flex:1;overflow:hidden;position:relative;}
#navBar{height:var(--navbar-h);display:flex;align-items:center;justify-content:space-around;background:rgba(10,11,18,0.95);border-top:1px solid var(--border);flex-shrink:0;padding:0 32px;z-index:50;}
.nav-btn{width:44px;height:44px;border:none;background:transparent;color:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:12px;}
.nav-btn:active{color:var(--text);background:var(--surface2);}
#toast{position:fixed;bottom:calc(var(--navbar-h) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,32,45,0.95);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:24px;font-size:13px;opacity:0;transition:opacity 0.2s,transform 0.2s;pointer-events:none;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
*{scrollbar-width:none;}*::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="phone">

  <div id="statusBar">
    <span id="statusTime">00:00</span>
    <div id="statusIcons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="rgba(255,255,255,0.8)">
        <rect x="0" y="6" width="3" height="6" rx="1"/>
        <rect x="4.5" y="4" width="3" height="8" rx="1"/>
        <rect x="9" y="2" width="3" height="10" rx="1"/>
        <rect x="13.5" y="0" width="2.5" height="12" rx="1" opacity="0.35"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="rgba(255,255,255,0.8)">
        <path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
        <path d="M8 6.5C9.7 6.5 11.2 7.2 12.3 8.3l1.3-1.3C12 5.4 10.1 4.5 8 4.5S4 5.4 2.4 7l1.3 1.3C4.8 7.2 6.3 6.5 8 6.5z"/>
      </svg>
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none">
        <rect x="0.5" y="0.5" width="18" height="11" rx="2.5" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
        <rect x="2" y="2" width="13" height="8" rx="1.5" fill="rgba(255,255,255,0.8)"/>
        <path d="M20 4.5v3a1.5 1.5 0 000-3z" fill="rgba(255,255,255,0.5)"/>
      </svg>
    </div>
  </div>

  <div id="mainArea">
    <div id="homeScreen">
      <div id="clockWidget">
        <div id="clockTime">00:00</div>
        <div id="clockDate">&#x52A0;&#x8F7D;&#x4E2D;...</div>
      </div>
      <div id="appGrid"></div>
      <div id="dock"></div>
    </div>
    <div id="appLayer">
      <div id="appHeader">
        <button id="appHeaderBack">
          <svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 1L1 9l8 8"/>
          </svg>
        </button>
        <span id="appHeaderTitle"></span>
        <div id="appHeaderRight"></div>
      </div>
      <div id="appContent"></div>
    </div>
  </div>

  <div id="navBar">
    <button class="nav-btn" id="navBack">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button class="nav-btn" id="navHome">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>
    </button>
    <button class="nav-btn" id="navRecents">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
  </div>

</div>
<div id="toast"></div>

<script type="module">

/* ---- App list (all non-ASCII as Unicode escapes) ---- */
var APPS = [
  { id:'chat',      name:'\u804A\u5929',         emoji:'\uD83D\uDCAC', color:'#1a6b45', dock:true  },
  { id:'contacts',  name:'\u8054\u7CFB\u4EBA',   emoji:'\uD83D\uDC64', color:'#1a4a7a', dock:true  },
  { id:'moments',   name:'\u670B\u53CB\u5708',   emoji:'\uD83C\uDF38', color:'#6b1a3a', dock:false },
  { id:'worldbook', name:'\u4E16\u754C\u4E66',   emoji:'\uD83D\uDCD6', color:'#5a4200', dock:false },
  { id:'theme',     name:'\u7F8E\u5316',         emoji:'\uD83C\uDFA8', color:'#3a1a6b', dock:false },
  { id:'settings',  name:'\u8BBE\u7F6E',         emoji:'S',            color:'#2a2e40', dock:true  },
  { id:'couple',    name:'\u60C5\u4FA3\u7A7A\u95F4', emoji:'\uD83D\uDC95', color:'#6b1a4a', dock:false, placeholder:true },
  { id:'shop',      name:'\u8D2D\u7269',         emoji:'\uD83D\uDED2', color:'#5a3a00', dock:false, placeholder:true }
];

/* ---- Toast ---- */
window.showToast = function(msg, dur) {
  dur = dur || 2000;
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, dur);
};

/* ---- Clock ---- */
var WK = ['\u661F\u671F\u65E5','\u661F\u671F\u4E00','\u661F\u671F\u4E8C',
          '\u661F\u671F\u4E09','\u661F\u671F\u56DB','\u661F\u671F\u4E94','\u661F\u671F\u516D'];

function tick() {
  var n = new Date();
  var h = String(n.getHours()).padStart(2,'0');
  var m = String(n.getMinutes()).padStart(2,'0');
  var t = h + ':' + m;
  document.getElementById('clockTime').textContent = t;
  document.getElementById('statusTime').textContent = t;
  document.getElementById('clockDate').textContent =
    n.getFullYear() + '\u5E74' + (n.getMonth()+1) + '\u6708' +
    n.getDate() + '\u65E5 ' + WK[n.getDay()];
}

/* ---- Icons ---- */
function makeIcon(app, State, small) {
  var wrap = document.createElement('div');
  wrap.className = 'app-icon-wrap';
  var ic = document.createElement('div');
  ic.className = 'app-icon' + (app.placeholder ? ' placeholder' : '');
  ic.style.background = app.color;
  var ci = State.getAppIcon(app.id);
  if (ci) { var img = document.createElement('img'); img.src = ci; ic.appendChild(img); }
  else ic.textContent = app.emoji;
  wrap.appendChild(ic);
  if (!small) {
    var lb = document.createElement('div');
    lb.className = 'app-icon-label';
    lb.textContent = app.name;
    wrap.appendChild(lb);
  }
  wrap.addEventListener('click', function() {
    if (app.placeholder) { window.showToast('\u5373\u5C06\u4E0A\u7EBF'); return; }
    window._Router.open(app.id, { title: app.name });
  });
  return wrap;
}

function renderHome(State) {
  var grid = document.getElementById('appGrid');
  var dock = document.getElementById('dock');
  grid.innerHTML = ''; dock.innerHTML = '';
  APPS.forEach(function(app) {
    grid.appendChild(makeIcon(app, State, false));
    if (app.dock) dock.appendChild(makeIcon(app, State, true));
  });
}

function applyTheme(State) {
  var t = State.theme;
  if (t.accentColor) document.documentElement.style.setProperty('--accent', t.accentColor);
  if (t.bgColor) document.documentElement.style.setProperty('--bg', t.bgColor);
  if (t.wallpaper) {
    var hs = document.getElementById('homeScreen');
    hs.style.backgroundImage = 'url(' + t.wallpaper + ')';
    hs.style.backgroundSize = 'cover';
    hs.style.backgroundPosition = 'center';
  }
}

/* ---- Boot ---- */
import('./core/state.js').then(function(sm) {
  return import('./core/storage.js').then(function(stm) {
    return import('./core/router.js').then(function(rm) {
      return import('./core/events.js').then(function(em) {
        var State   = sm.State;
        var Storage = stm.Storage;
        var Router  = rm.Router;
        var Events  = em.Events;

        Storage.init();
        State.init();
        Router.init(APPS);
        window._Router = Router;

        renderHome(State);
        tick();
        setInterval(tick, 5000);
        applyTheme(State);

        document.getElementById('navBack').addEventListener('click', function(){ Router.back(); });
        document.getElementById('navHome').addEventListener('click', function(){ Router.home(); });
        document.getElementById('navRecents').addEventListener('click', function(){
          window.showToast('\u6682\u65E0\u6700\u8FD1\u8BB0\u5F55');
        });
        document.getElementById('appHeaderBack').addEventListener('click', function(){ Router.back(); });

        Events.on('theme:update', function(){ applyTheme(State); renderHome(State); });
        Events.on('home:refresh', function(){ renderHome(State); });
      });
    });
  });
}).catch(function(e) {
  document.getElementById('clockTime').textContent = '\u51FA\u9519';
  document.getElementById('clockDate').textContent = e.message || String(e);
});

</script>
</body>
</html>
